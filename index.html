<title>Acceso</title>
<style>
  :root { --fondo: #f6f3ec; --panel: #ffffff; --linea: #e4ded1; --texto: #161616; --suave: #6b665c; --uva: #a88a4a; --ria: #161616; --mal: #b3372c; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
  form { width: min(100%, 380px); background: var(--panel); border: 1px solid var(--linea); border-top: 4px solid var(--texto); border-radius: 10px; padding: 28px 24px; display: grid; gap: 14px; box-shadow: 0 6px 24px rgba(22,22,22,.08); }
  .logo { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto 6px; }
  h1 { font: 400 22px/1.25 Georgia, "Times New Roman", serif; margin: 0; }
  p { margin: 0; color: var(--suave); font-size: 13px; }
  label { font-size: 13px; font-weight: 600; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 6px; margin-top: 6px; color: var(--texto); background: #fff; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ria); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 6px; background: var(--ria); color: #fff; cursor: pointer; }
  button:hover { background: #333; }
  input:focus-visible, button:focus-visible { outline-color: var(--uva); }
  button[disabled] { opacity: .6; cursor: progress; }
  .erro { color: var(--mal); font-size: 13px; min-height: 1.2em; }
</style>
